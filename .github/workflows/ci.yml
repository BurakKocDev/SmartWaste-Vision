name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependency
        run: python -m pip install pytest==9.1.1
      - name: Validate deterministic dataset contract
        run: python -m pytest -q tests/test_realwaste_splits.py
      - name: Compile project Python sources
        run: python -m compileall -q api scripts tests
